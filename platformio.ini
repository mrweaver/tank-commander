; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; ESP32 is the only deployed target (the D1 Mini Lite / ESP8266 board is retired)
default_envs = mhetesp32minikit

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    ; 160  ; Adafruit INA219
    https://github.com/mrweaver/Adafruit_INA219
    64   ; ArduinoJSON
    89   ; PubSubClient
    1322 ; RunningAverage
    6214 ; Adafruit BusIO

[env:mhetesp32minikit]
platform = espressif32
board = mhetesp32minikit
framework = ${common.framework}
monitor_filters = esp32_exception_decoder
monitor_speed = ${common.monitor_speed}
upload_speed = 921600
lib_deps =
    ${common.lib_deps}

build_flags =
    -D P_SCL=22
    -D P_SDA=21
    -D P_KEEPAWAKE=18
    -D P_VALVE_PWR=19
    -D P_VALVE_DIR=23

[env:mhetesp32minikit_ota]
extends = env:mhetesp32minikit
upload_protocol = espota
upload_port = TankCommander.local ; Replace with your ESP32 IP address or mDNS name
upload_flags =
    --auth=TankOTA2026

